<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="t">
  <title id="t">SQL-tietokanta: tietokantasylinteri ja Artist-taulu, josta haetaan rivejä Javalla</title>
